# Render Blueprint: en Render → New → Blueprint, elige este repositorio y llena los valores
# marcados con «sync: false» (Render te los pide; no se guardan en el código).
services:
  - type: web
    name: emergexia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Cadena de conexión de MongoDB Atlas (la misma de backend/.env). En Atlas → Network
      # Access agrega 0.0.0.0/0 (o las IP de salida de Render) para que Render pueda entrar.
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: emergexia
      # Firma de las sesiones: Render genera una larga y aleatoria.
      - key: JWT_SECRET
        generateValue: true
      # Solo se usan si la base está vacía, para crear el primer administrador.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
